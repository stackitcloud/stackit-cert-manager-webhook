apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: stackit-e2e-issuer
  namespace: default
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: e2e-test@stackit.de
    privateKeySecretRef:
      name: stackit-e2e-issuer-key
    solvers:
      - dns01:
          webhook:
            solverName: stackit
            groupName: acme.stackit.de
            config:
              projectId: ${PROJECT_ID}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: e2e-cert
  namespace: default
spec:
  secretName: e2e-cert-tls
  issuerRef:
    name: stackit-e2e-issuer
    kind: Issuer
  commonName: "e2e-cert.${ZONE_NAME}"
  dnsNames:
    - "e2e-cert.${ZONE_NAME}"