---
# Create a selfsigned Issuer, in order to create a root CA certificate for
# signing webhook serving certificates
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "stackit-cert-manager-webhook.selfSignedIssuer" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "stackit-cert-manager-webhook.name" . }}
    chart: {{ include "stackit-cert-manager-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  selfSigned: {}

---

# Generate a CA Certificate used to sign certificates for the webhook
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "stackit-cert-manager-webhook.rootCACertificate" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "stackit-cert-manager-webhook.name" . }}
    chart: {{ include "stackit-cert-manager-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  secretName: {{ include "stackit-cert-manager-webhook.rootCACertificate" . }}
  duration: {{ .Values.pki.caCertificate.duration }}
  {{- if .Values.pki.caCertificate.renewBefore }}
  renewBefore: {{ .Values.pki.caCertificate.renewBefore }}
  {{- end }}
  issuerRef:
    name: {{ include "stackit-cert-manager-webhook.selfSignedIssuer" . }}
  commonName: "ca.stackit-cert-manager-webhook.cert-manager"
  isCA: true
  privateKey:
    rotationPolicy: {{ .Values.pki.caCertificate.privateKey.rotationPolicy }}

---

# Create an Issuer that uses the above generated CA certificate to issue certs
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "stackit-cert-manager-webhook.rootCAIssuer" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "stackit-cert-manager-webhook.name" . }}
    chart: {{ include "stackit-cert-manager-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  ca:
    secretName: {{ include "stackit-cert-manager-webhook.rootCACertificate" . }}

---

# Finally, generate a serving certificate for the webhook to use
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "stackit-cert-manager-webhook.servingCertificate" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "stackit-cert-manager-webhook.name" . }}
    chart: {{ include "stackit-cert-manager-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  secretName: {{ include "stackit-cert-manager-webhook.servingCertificate" . }}
  duration: {{ .Values.pki.servingCertificate.duration }}
  {{- if .Values.pki.servingCertificate.renewBefore }}
  renewBefore: {{ .Values.pki.servingCertificate.renewBefore }}
  {{- end }}
  issuerRef:
    name: {{ include "stackit-cert-manager-webhook.rootCAIssuer" . }}
  dnsNames:
    - {{ include "stackit-cert-manager-webhook.fullname" . }}
    - {{ include "stackit-cert-manager-webhook.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "stackit-cert-manager-webhook.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "stackit-cert-manager-webhook.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    rotationPolicy: {{ .Values.pki.servingCertificate.privateKey.rotationPolicy }}
