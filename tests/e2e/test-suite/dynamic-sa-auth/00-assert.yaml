apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: e2e-tenant-cert
  namespace: e2e-tenant
status:
  conditions:
    - type: Ready
      status: "True"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: e2e-tenant-cert-two
  namespace: e2e-tenant-two
status:
  conditions:
    - type: Ready
      status: "True"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: e2e-cross-tenant-cert
  namespace: e2e-tenant
status:
  conditions:
    - type: Ready
      status: "False"
---
apiVersion: acme.cert-manager.io/v1
kind: Challenge
metadata:
  namespace: e2e-tenant
spec:
  dnsName: "e2e-cross-tenant.${ZONE_NAME}"
status:
  presented: false
  state: pending
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: |
      set -e
      for _ in $(seq 1 30); do
        REASON=$(kubectl get challenges.acme.cert-manager.io -n e2e-tenant -o jsonpath='{.items[*].status.reason}' 2>/dev/null || true)
        if echo "$REASON" | grep -q "serviceAccountSecretNamespace must match issuer namespace"; then
          echo "SUCCESS: Cross-tenant secret lookup rejected as expected: $REASON"
          exit 0
        fi
        sleep 2
      done
      echo "FAILED: Expected cross-tenant rejection reason not observed. Last reason: $REASON"
      exit 1